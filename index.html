<style>

/* Header */

.brand{font-size:1.1rem;font-weight:800;letter-spacing:2px;color:var(--accent);}

/* Navigation */

.nav-btn{

}
.nav-btn:hover{background:#f0eeea;}
.nav-btn:active{transform:scale(0.92);}
.nav-btn:disabled{opacity:0.3;cursor:default;transform:none;}
.nav-counter{font-size:0.8rem;color:var(--dim);text-align:center;}
.nav-counter b{color:var(--text);font-size:1rem;}

/* Style selector */
.style-row{display:flex;justify-content:center;gap:6px;margin:12px 0;}
.style-btn{
  padding:6px 14px;border:1px solid var(--border);border-radius:20px;
  background:var(--surface);font-family:inherit;font-size:0.72rem;font-weight:600;
  color:var(--dim);cursor:pointer;transition:all 0.2s;letter-spacing:0.5px;

<script>
const SITE_URL = "https://osakenpiro.github.io/konnichiwarld/";

// ═══ GOOGLE SHEETS CONFIG ═══
// To change the data source, replace this URL with your own published CSV URL.
// (Google Sheets → File → Share → Publish to web → CSV)
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTEPnDpa5jpZamkpqvcbV4qTC0AYZdQ4LIBY7VD2ZlQvmtxTKzSbTsdRZ-SzLciGNYke577OT9d2Et3/pub?gid=611850368&single=true&output=csv";

// ═══ DICTIONARY (fallback + live data) ═══
const FALLBACK_WORDS = [
  {ja:"こんにちは",reading:"Konnichiwa",pos:"greeting",meaning:"Hello / Good afternoon",explain:"The most universal Japanese greeting. Literally means something like \"As for today...\" — an unfinished sentence that became a hello. Use it from late morning to evening."},
  {ja:"ありがとう",reading:"Arigatou",pos:"expression",meaning:"Thank you",explain:"From 'arigatashi' meaning 'rare / precious.' When you thank someone in Japanese, you're literally saying 'this is a rare and precious thing you've done.' The polite form is 'arigatou gozaimasu.'"},
  {ja:"木漏れ日",reading:"Komorebi",pos:"noun",meaning:"Sunlight filtering through trees",explain:"One of those beautiful words that only exists in Japanese. It describes the dancing pattern of light and shadow when sunshine pokes through leaves. No single English word captures this."},
  {ja:"もったいない",reading:"Mottainai",pos:"adjective",meaning:"What a waste!",explain:"More than just 'wasteful' — it carries a sense of deep respect for resources and regret at not using something's full potential. It became a global environmental slogan."},
  {ja:"お疲れ様",reading:"Otsukaresama",pos:"expression",meaning:"Good work / Thanks for your effort",explain:"Said to anyone who's been working hard. Literally 'you are tired.' Used when leaving work, finishing a task, or just acknowledging someone's effort. There's no real English equivalent."},
  {ja:"居酒屋",reading:"Izakaya",pos:"noun",meaning:"Japanese pub / tavern",explain:"A casual bar-restaurant where people go after work to drink, eat small dishes, and unwind. 'I' means stay, 'zaka' means sake, 'ya' means shop. The heart of Japanese nightlife."},
  {ja:"懐かしい",reading:"Natsukashii",pos:"adjective",meaning:"Nostalgic / How I've missed this",explain:"That warm fuzzy feeling when you encounter something from your past. Unlike English 'nostalgic,' it's always positive — pure fondness without the ache."},
  {ja:"生きがい",reading:"Ikigai",pos:"noun",meaning:"Reason for living",explain:"Your purpose. The thing that gets you out of bed every morning. It's not about grand goals — it can be as simple as your morning coffee, your garden, or making someone smile."},
  {ja:"侘び寂び",reading:"Wabi-sabi",pos:"noun",meaning:"Beauty in imperfection",explain:"The acceptance and appreciation of things that are imperfect, impermanent, and incomplete. A cracked teacup, weathered wood, fading autumn leaves — these are beautiful BECAUSE they're flawed."},
  {ja:"しょうがない",reading:"Shouganai",pos:"expression",meaning:"It can't be helped",explain:"A philosophical acceptance of things beyond your control. Not giving up — more like gracefully acknowledging reality and moving forward. One of the most commonly used expressions in daily life."},
  {ja:"いただきます",reading:"Itadakimasu",pos:"expression",meaning:"I humbly receive",explain:"Said before every meal. It's gratitude toward everyone involved — the cook, the farmer, and even the food itself. There is no English phrase like it. It's respect on a plate."},
  {ja:"ごちそうさま",reading:"Gochisousama",pos:"expression",meaning:"Thank you for the meal",explain:"Said after eating. 'Chisou' originally meant running around to gather ingredients. So you're thanking the host for all the effort — from shopping to cooking to serving."},
  {ja:"金継ぎ",reading:"Kintsugi",pos:"noun",meaning:"Repairing with gold",explain:"The art of fixing broken pottery with golden lacquer. Instead of hiding the damage, it highlights the cracks as part of the object's history. Broken things become more beautiful."},
  {ja:"おもてなし",reading:"Omotenashi",pos:"noun",meaning:"Wholehearted hospitality",explain:"Selfless, anticipatory hospitality where the host thinks of every detail before the guest even notices. No tips expected. It's not service — it's a gift freely given."},
  {ja:"空気を読む",reading:"Kuuki wo yomu",pos:"expression",meaning:"Read the room",explain:"Literally 'read the air.' The skill of sensing unspoken feelings and social cues. In Japan, what's NOT said is often more important than what IS said."},
  {ja:"本音と建前",reading:"Honne to Tatemae",pos:"noun",meaning:"True feelings vs. public face",explain:"Honne is your real opinion. Tatemae is what you show in public. Everyone has both. It's not lying — it's social harmony. Understanding this duality is key to understanding Japan."},
  {ja:"改善",reading:"Kaizen",pos:"noun",meaning:"Continuous improvement",explain:"Small, daily improvements that compound into massive change. Made famous by Toyota. The philosophy: don't aim for perfection in one leap. Just be 1% better today than yesterday."},
  {ja:"先輩",reading:"Senpai",pos:"noun",meaning:"Senior / Someone ahead of you",explain:"Not just 'older student.' A senpai guides, mentors, and takes responsibility for those who came after. The senpai-kouhai bond is one of the pillars of Japanese social structure."},
  {ja:"可愛い",reading:"Kawaii",pos:"adjective",meaning:"Cute / Adorable",explain:"Way more than 'cute.' Kawaii is an entire cultural force — it shapes fashion, food, business, even government mascots. In Japan, cuteness is power, and everything can be kawaii."},
  {ja:"渋い",reading:"Shibui",pos:"adjective",meaning:"Understated cool / Refined simplicity",explain:"The opposite of flashy. A beautifully aged leather bag, a perfectly brewed black coffee, a man who says little but means everything. Shibui is the coolness of restraint."},
  {ja:"森林浴",reading:"Shinrin-yoku",pos:"noun",meaning:"Forest bathing",explain:"Not hiking. Not exercising. Just BEING in a forest — breathing, listening, existing among trees. Science proved what Japan always knew: forests heal. Now prescribed by doctors worldwide."},
  {ja:"一期一会",reading:"Ichigo Ichie",pos:"expression",meaning:"One time, one meeting",explain:"Every encounter is unique and will never repeat. Treasure this exact moment with this exact person, because it's literally once in a lifetime. Born from tea ceremony philosophy."},
  {ja:"猫舌",reading:"Nekojita",pos:"noun",meaning:"Cat tongue",explain:"A person who can't eat or drink hot things. Literally 'cat tongue.' Because cats notoriously can't handle hot food. If hot ramen burns your mouth, you have nekojita."},
  {ja:"食い倒れ",reading:"Kuidaore",pos:"noun",meaning:"Eating yourself into ruin",explain:"Spending all your money on food until you go bankrupt. Osaka's unofficial motto. It's not a warning — it's a lifestyle. The food is just THAT good."},
  {ja:"積ん読",reading:"Tsundoku",pos:"noun",meaning:"Buying books and never reading them",explain:"That tower of unread books on your nightstand? Japan has a word for it. 'Tsun' means to pile up, 'doku' means to read. No shame — it's practically a hobby."},
  {ja:"花見",reading:"Hanami",pos:"noun",meaning:"Cherry blossom viewing",explain:"Gathering under cherry blossom trees to eat, drink, and appreciate the fleeting beauty. The blossoms last about two weeks. That's the point — beauty is beautiful BECAUSE it ends."},
  {ja:"縁",reading:"En",pos:"noun",meaning:"Fate / Mysterious bond",explain:"The invisible thread connecting people who are meant to meet. Not destiny exactly — more like a gentle force that brings the right people together at the right time."},
  {ja:"七転び八起き",reading:"Nana korobi ya oki",pos:"proverb",meaning:"Fall seven times, stand up eight",explain:"The quintessential Japanese attitude toward failure. You will fall. That's guaranteed. What matters is that you always get up one more time than you fall."},
  {ja:"勿体",reading:"Mottai",pos:"noun",meaning:"The intrinsic dignity of a thing",explain:"The root of 'mottainai.' Everything has inherent value and deserves respect — a grain of rice, a pencil stub, an old shirt. Nothing is 'just a thing.'"},
  {ja:"お花畑",reading:"Ohanabatake",pos:"noun",meaning:"Flower field (naive person)",explain:"Literally 'flower field.' Slang for someone who's hopelessly naive or lost in their own happy world. 'Their head is a flower field' — oblivious but kind of charming."},
  {ja:"真面目",reading:"Majime",pos:"adjective",meaning:"Serious / Earnest / Diligent",explain:"Not 'serious' in a boring way. Majime people are reliable, hardworking, and sincere. It's one of the highest compliments in Japan. You can trust a majime person with anything."},
  {ja:"ぼんやり",reading:"Bon'yari",pos:"adverb",meaning:"Spacing out / In a daze",explain:"That pleasant state of not-quite-thinking. Staring out a train window, mind blank, watching the world go by. Not lazy — more like your brain taking a gentle nap while you're awake."},
  {ja:"飲み会",reading:"Nomikai",pos:"noun",meaning:"Drinking party / Social gathering",explain:"Way more than just drinks. It's where coworkers actually say what they think, friendships deepen, and deals get made. The real business of Japan happens at nomikai."},
  {ja:"我慢",reading:"Gaman",pos:"noun",meaning:"Enduring with patience and dignity",explain:"Bearing the unbearable with grace. Not complaining, not breaking, just quietly enduring. It's considered a virtue, though modern Japan is learning it's okay to NOT gaman sometimes."},
  {ja:"お弁当",reading:"Obentou",pos:"noun",meaning:"Packed lunch box",explain:"Not just lunch in a box. Japanese bento is edible art — carefully arranged, nutritionally balanced, and made with love. Some parents wake at 5am to make their kid's bento picture-perfect."},
  {ja:"切ない",reading:"Setsunai",pos:"adjective",meaning:"A bittersweet ache in the heart",explain:"That tight feeling in your chest when something is beautiful and sad at the same time. Watching someone you love walk away. A song that reminds you of a time that's gone. Painfully tender."},
  {ja:"頑張って",reading:"Ganbatte",pos:"expression",meaning:"Do your best! / Hang in there!",explain:"The universal Japanese encouragement. Before exams, sports, work, anything hard. It doesn't mean 'you'll win' — it means 'I see your effort, and it matters.' That's often all we need to hear."},
  {ja:"よろしく",reading:"Yoroshiku",pos:"expression",meaning:"Please treat me well",explain:"Said when meeting someone, starting a project, or asking a favor. It basically means 'let's have a good relationship going forward.' Impossible to translate in one English phrase."},
  {ja:"わびしい",reading:"Wabishii",pos:"adjective",meaning:"Lonely desolation / Austere beauty",explain:"A deep, quiet loneliness — but not entirely negative. It's the solitude of a single flower in a cracked vase. The beauty found in stark simplicity and aloneness."},
  {ja:"八百万の神",reading:"Yaoyorozu no kami",pos:"noun",meaning:"Eight million gods",explain:"In Shinto, everything has a spirit — rivers, mountains, old trees, even your kitchen knife. 'Eight million' just means 'countless.' The whole world is sacred and alive."},
];

let WORDS = [...FALLBACK_WORDS];

// ═══ GOOGLE SHEETS LOADER ═══
function parseCSV(text) {
  const lines = text.split("\n").filter(l => l.trim());
  if (lines.length < 2) return [];
  // Skip header row
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = parseCSVLine(lines[i]);
    if (cols.length >= 5 && cols[0].trim()) {
      rows.push({
        ja: cols[0].trim(),
        reading: cols[1].trim(),
        pos: cols[2].trim(),
        meaning: cols[3].trim(),
        explain: cols[4].trim(),
      });
    }
  }
  return rows;
}

function parseCSVLine(line) {
  const result = [];
  let current = "", inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQuotes) {
      if (ch === '"' && line[i+1] === '"') { current += '"'; i++; }
      else if (ch === '"') { inQuotes = false; }
      else { current += ch; }
    } else {
      if (ch === '"') { inQuotes = true; }
      else if (ch === ',') { result.push(current); current = ""; }
      else { current += ch; }
    }
  }
  result.push(current);
  return result;
}

async function loadFromSheets() {
  if (!SHEET_CSV_URL) return false;
  try {
    showLoading(true);
    const res = await fetch(SHEET_CSV_URL);
    if (!res.ok) throw new Error("Fetch failed: " + res.status);
    const text = await res.text();
    const parsed = parseCSV(text);
    if (parsed.length > 0) {
      WORDS = parsed;
      showLoading(false);
      const badge = document.getElementById("source-badge");
      if (badge) badge.style.display = "block";
      toast("📖 Loaded " + WORDS.length + " words from Google Sheets");
      return true;
    }
  } catch(e) {
    console.warn("Google Sheets load failed, using fallback:", e);
  }
  showLoading(false);
  return false;
}

function showLoading(on) {
  const el = document.getElementById("loading");
  if (el) el.style.display = on ? "flex" : "none";
}

      // Confetti dots
      const colors=["#ff6b6b","#ffd93d","#6bcb77","#4d96ff","#ff922b","#cc5de8"];
      ctx.globalAlpha=0.12;
      for(let i=0;i<60;i++){
        ctx.fillStyle=colors[i%colors.length];
        ctx.beginPath();
        ctx.arc(Math.random()*W,Math.random()*H,Math.random()*20+5,0,Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha=1;
    },
    jaFont:"900 54px sans-serif", jaColor:"#e64980",
    readFont:"400 20px sans-serif", readColor:"#888",
    posFont:"700 13px sans-serif", posColor:"#fff",
    meaningFont:"800 22px sans-serif", meaningColor:"#2b2b2b",
    explainFont:"400 17px sans-serif", explainColor:"#555",
    brandColor:"#e64980", brandBg:null,
    posBg:"#e64980",
  },
  ink: {
    name: "Ink",
    label: "墨",
    bg: (ctx,W,H) => {
      ctx.fillStyle="#1a1a1a"; ctx.fillRect(0,0,W,H);
      // Brush stroke texture
      ctx.globalAlpha=0.06; ctx.fillStyle="#fff";
      for(let i=0;i<800;i++){
        const x=Math.random()*W, y=Math.random()*H;
        ctx.fillRect(x,y,Math.random()*3,Math.random()*1.5);
      }
      ctx.globalAlpha=1;
      // Enso circle hint
      ctx.globalAlpha=0.05;
      ctx.strokeStyle="#fff"; ctx.lineWidth=40;
      ctx.beginPath(); ctx.arc(W*0.75,H*0.45,180,0.3,5.5); ctx.stroke();
      ctx.globalAlpha=1;
    },
    jaFont:"bold 56px serif", jaColor:"#e8e4dc",
    readFont:"300 20px sans-serif", readColor:"rgba(255,255,255,0.35)",
    posFont:"600 13px sans-serif", posColor:"#c0392b",
    meaningFont:"600 22px sans-serif", meaningColor:"rgba(255,255,255,0.9)",
    explainFont:"400 17px sans-serif", explainColor:"rgba(255,255,255,0.5)",
    brandColor:"#c0392b", brandBg:null,
  },
};

// ═══ STATE ═══
let idx = 0;
let style = "washi";

// ═══ INIT ═══
async function init() {
  buildStyleRow();
  await loadFromSheets();
  render();
}

function buildStyleRow() {
  const el = document.getElementById("style-row");
  el.innerHTML = Object.entries(STYLES).map(([k,v]) =>
    `<button class="style-btn${k===style?" active":""}" data-s="${k}" onclick="setStyle('${k}')">${v.label}</button>`
  ).join("");
}

function setStyle(s) {
  style = s;
  buildStyleRow();
  render();
}

// ═══ RENDER ═══
function render() {
  const w = WORDS[idx];
  const st = STYLES[style];
  document.getElementById("nav-cur").textContent = idx+1;
  document.getElementById("nav-total").textContent = WORDS.length;
  document.getElementById("btn-prev").disabled = idx===0;
  document.getElementById("btn-next").disabled = idx===WORDS.length-1;

  // CSS preview card
  const isLight = ["washi","modern","pop"].includes(style);
  const el = document.getElementById("card-display");
  el.innerHTML = `<div class="card-inner" style="background:${
    style==="washi"?"#f5f0e6":
    style==="modern"?"#ffffff":
    style==="neon"?"linear-gradient(135deg,#0a0a1a,#1a0a2e)":
    style==="pop"?"#fff4e6":
    "#1a1a1a"
  };${style==="washi"?"border-left:4px solid #c0392b;":""}">
    <div style="font-size:0.7rem;font-weight:600;color:${st.posColor};letter-spacing:2px;text-transform:uppercase;${
      st.posBg?`background:${st.posBg};color:#fff;display:inline-block;padding:3px 10px;border-radius:10px;`:""
    }">${w.pos}</div>
    <div style="font-size:2rem;font-weight:900;color:${st.jaColor};margin:8px 0 2px;line-height:1.2;">${w.ja}</div>
    <div style="font-size:0.85rem;color:${st.readColor};margin-bottom:12px;">${w.reading}</div>
    <div style="font-size:1.05rem;font-weight:700;color:${st.meaningColor};margin-bottom:10px;">${w.meaning}</div>
    <div style="font-size:0.82rem;color:${st.explainColor};line-height:1.65;">${w.explain}</div>
  </div>`;
}

// ═══ NAVIGATION ═══
function next() { if(idx<WORDS.length-1){idx++;render();} }
function prev() { if(idx>0){idx--;render();} }
function random() { idx=Math.floor(Math.random()*WORDS.length); render(); }
function jumpTo(i) { idx=i; closeList(); render(); }

// ═══ WORD LIST ═══
function openList() {
  const el = document.getElementById("list-items");
  el.innerHTML = WORDS.map((w,i) =>
    `<div class="list-item" onclick="jumpTo(${i})">
      <div><div class="list-word">${w.ja}</div><div class="list-reading">${w.reading}</div></div>
      <div class="list-meaning">${w.meaning}</div>
    </div>`
  ).join("");
  document.getElementById("list-overlay").classList.add("show");
}
function closeList() { document.getElementById("list-overlay").classList.remove("show"); }
function closeListBg(e) { if(e.target===e.currentTarget) closeList(); }

// ═══ CANVAS CARD DRAWING ═══
function drawCard() {
  const cv = document.getElementById("cv");
  const W=1200, H=630;
  cv.width=W; cv.height=H;
  const ctx = cv.getContext("2d");
  const w = WORDS[idx];
  const st = STYLES[style];

  // Background
  st.bg(ctx, W, H);

  // Layout
  const LX = 80, RX = W-80;
  const TW = RX-LX;

  // POS tag
  ctx.font = st.posFont;
  ctx.fillStyle = st.posColor;
  if(st.posBg) {
    const pw = ctx.measureText(w.pos.toUpperCase()).width+20;
    roundRect(ctx,LX,52,pw,26,13);
    ctx.fillStyle=st.posBg; ctx.fill();
    ctx.fillStyle="#fff";
  }
  ctx.textBaseline="top";
  ctx.fillText(w.pos.toUpperCase(), st.posBg?LX+10:LX, st.posBg?57:56);

  // Japanese word
  ctx.font = st.jaFont;
  ctx.fillStyle = st.jaColor;
  const jaLines = wrapText(ctx, w.ja, TW, 1);
  jaLines.forEach((l,i) => ctx.fillText(l, LX, 100+i*60));
  const jaBottom = 100 + jaLines.length*60;

  // Reading
  ctx.font = st.readFont;
  ctx.fillStyle = st.readColor;
  ctx.fillText(w.reading, LX, jaBottom+4);

  // Meaning
  ctx.font = st.meaningFont;
  ctx.fillStyle = st.meaningColor;
  ctx.fillText(w.meaning, LX, jaBottom+40);

  // Explanation
  ctx.font = st.explainFont;
  ctx.fillStyle = st.explainColor;
  const exLines = wrapText(ctx, w.explain, TW, 4);
  exLines.forEach((l,i) => ctx.fillText(l, LX, jaBottom+80+i*28));

  // Brand
  ctx.font = "bold 16px sans-serif";
  ctx.fillStyle = st.brandColor;
  ctx.fillText("KON-NICHI-WAR(L)D", LX, H-46);
  ctx.font = "300 12px sans-serif";
  ctx.fillStyle = st.readColor;
  ctx.fillText("JAPANESE FOR HUMANS", LX+200, H-43);

  // Card number
  ctx.font = "400 14px sans-serif";
  ctx.fillStyle = st.readColor;
  const numTxt = `${idx+1} / ${WORDS.length}`;
  ctx.fillText(numTxt, RX-ctx.measureText(numTxt).width, H-44);
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

function wrapText(ctx,text,max,maxLines){
  const chars=[...text],lines=[];let cur="";
  for(const ch of chars){
    const t=cur+ch;
    if(ctx.measureText(t).width>max){lines.push(cur);cur=ch;if(lines.length>=maxLines){lines[lines.length-1]=lines[lines.length-1].slice(0,-1)+"…";return lines;}}
    else cur=t;
  }
  if(cur)lines.push(cur);
  return lines;
}

// ═══ SHARE ═══
function downloadCard() {
  drawCard();
  const a=document.createElement("a");
  a.download=`konnichiwarld_${WORDS[idx].reading.toLowerCase()}.png`;
  a.href=document.getElementById("cv").toDataURL("image/png");
  a.click();
  toast("📥 Saved!");
}

function shareX() {
  const w = WORDS[idx];
  const text = `🇯🇵 ${w.ja}（${w.reading}）\n${w.meaning}\n\n${w.explain.slice(0,100)}...\n\n#KonnichiWarld #Japanese\n${SITE_URL}`;
  window.open("https://twitter.com/intent/tweet?text="+encodeURIComponent(text),"_blank");
  toast("𝕏 Opening post...");
}

// ═══ UTILS ═══
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2500);}

// ═══ TOUCH SWIPE ═══
let touchStartX=0;
document.addEventListener("touchstart",e=>{touchStartX=e.touches[0].clientX;},{passive:true});
document.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-touchStartX;
  if(Math.abs(dx)>60){if(dx<0)next();else prev();}
},{passive:true});

// ═══ KEYBOARD ═══
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key==="ArrowDown")next();
  if(e.key==="ArrowLeft"||e.key==="ArrowUp")prev();
  if(e.key===" "){e.preventDefault();random();}
});

init();
</script>
